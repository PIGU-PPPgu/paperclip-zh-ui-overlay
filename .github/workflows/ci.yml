name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install sidecar dependencies
        run: npm ci --prefix sidecar --omit=dev --no-audit --no-fund

      - name: Check syntax
        run: node --check overlay.js && node --check install.mjs && node --check sidecar/proxy.mjs

      - name: Run tests
        run: npm test
